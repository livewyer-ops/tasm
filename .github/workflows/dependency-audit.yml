name: Dependency audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Scan Cargo and npm lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependency advisories
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa \
            scan source -L Cargo.lock -L package-lock.json
