name: Validate TASM and websites
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Full validation' || 'Build checks' }} - ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tasm-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  minimum-node:
    name: Build and run the TAMS contract on Node 22.19.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
      - run: npm ci --engine-strict
      - run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - run: npm run build && npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- contract.spec.ts --project=chromium

  build:
    name: Validate core and independent Cloudflare assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and check core, websites and Cloudflare configuration
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: checks
          load: true
          tags: tasm:checks
          cache-from: type=gha,scope=tasm-checks
          cache-to: type=gha,scope=tasm-checks,mode=max
      - name: Extract independent build artifacts
        run: |
          container=$(docker create tasm:checks)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p dist
          docker cp "$container:/app/dist/." dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tasm-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  browser:
    name: ${{ github.event_name != 'pull_request' && format('{0} ({1}/{2})', matrix.browser, matrix.shard, matrix.browser == 'webkit' && 4 || matrix.browser == 'firefox' && 2 || 1) || 'Chromium smoke' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '["chromium","firefox","webkit"]' || '["chromium"]') }}
        shard: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '[1,2,3,4]' || '[1]') }}
        exclude:
          - { browser: chromium, shard: 2 }
          - { browser: chromium, shard: 3 }
          - { browser: chromium, shard: 4 }
          - { browser: firefox, shard: 4 }
          - { browser: firefox, shard: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare cached browser environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test-runner
          load: true
          tags: tasm:browser
          build-args: PLAYWRIGHT_BROWSER=${{ matrix.browser }}
          cache-from: type=gha,scope=tasm-browser-${{ matrix.browser }}
          cache-to: ${{ matrix.shard == 1 && format('type=gha,scope=tasm-browser-{0},mode=max', matrix.browser) || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tasm-dist
          path: dist/
      - name: Run browser tests
        id: tests
        run: |
          docker run --name tasm-browser --shm-size=1g \
            --env CI=true --env GITHUB_ACTIONS=true \
            --mount "type=bind,src=$GITHUB_WORKSPACE/dist,dst=/app/dist,readonly" \
            tasm:browser sh scripts/test-browser.sh \
            ${{ github.event_name == 'pull_request' && '--smoke' || '' }} --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.browser == 'webkit' && 4 || matrix.browser == 'firefox' && 2 || 1 }}
      - name: Collect browser reports
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          docker cp tasm-browser:/app/test-results ./test-results
          docker cp tasm-browser:/app/playwright-report ./playwright-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: browser-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
