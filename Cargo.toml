[workspace]
members = ["core/rust", "core/browser/rust", "core/cloudflare/rust"]
resolver = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["json", "matched-path"] }
futures-util = "=0.3.34"
ipnet = "=2.12.2"
js-sys = "=0.3.81"
percent-encoding = "=2.3.2"
send_wrapper = { version = "=0.6.0", features = ["futures"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
url = "=2.5.9"
uuid = { version = "=1.29.2", features = ["serde", "v4", "js"] }
wasm-bindgen = "=0.2.104"
wasm-bindgen-futures = "=0.4.54"
